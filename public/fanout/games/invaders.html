<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Invaders</title>
<style>
html,body{margin:0;height:100%;background:#05060f;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#w{position:relative;width:360px;height:640px}
canvas{display:block;width:360px;height:640px;background:#05060f;border:1px solid #1b2146}
</style></head><body>
<div id="w"><canvas id="c" width="360" height="640"></canvas></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=360,H=640;
const demo=/[?&]demo=1/.test(location.search);
const keys={};let touchL=0,touchR=0,touchF=0,dragX=null;
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code=='Space'||e.code.startsWith('Arrow'))e.preventDefault();if(state!='play'&&(e.code=='Space'||e.code=='Enter'))start()});
addEventListener('keyup',e=>keys[e.code]=0);
// touch: bottom buttons + drag
const BTN={l:{x:10,y:586,w:70,h:44},r:{x:90,y:586,w:70,h:44},f:{x:270,y:586,w:80,h:44}};
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function hit(b,p){return p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h}
const touches={};
function updTouch(){touchL=touchR=touchF=0;dragX=null;
 for(const id in touches){const p=touches[id];
  if(hit(BTN.l,p))touchL=1;else if(hit(BTN.r,p))touchR=1;else if(hit(BTN.f,p))touchF=1;else{dragX=p.x;touchF=1}}}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);touches[e.pointerId]=pt(e);updTouch();if(state!='play')start()});
cv.addEventListener('pointermove',e=>{if(touches[e.pointerId]){touches[e.pointerId]=pt(e);updTouch()}});
const up=e=>{delete touches[e.pointerId];updTouch()};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

let state='play',score,lives,level,ship,bullets,ebullets,inv,dir,spd,tick,cool,stars=[],parts=[],hi=0,overT=0,shields,msg=0;
for(let i=0;i<60;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:.2+Math.random()*.8});
function start(){score=0;lives=3;level=1;ship={x:W/2,inv:0};state='play';wave()}
function wave(){bullets=[];ebullets=[];parts=[];inv=[];dir=1;tick=0;cool=0;msg=90;
 spd=18+level*3;
 for(let r=0;r<5;r++)for(let c=0;c<8;c++)inv.push({x:40+c*34,y:70+r*28,r,alive:1});
 shields=[];for(let i=0;i<4;i++)for(let a=0;a<6;a++)for(let b=0;b<3;b++)shields.push({x:36+i*80+a*7,y:500+b*7,hp:2});
}
const COL=['#ff5ea8','#ffb347','#ffe66d','#6df0a8','#5ec8ff'];
function boom(x,y,c){for(let i=0;i<10;i++)parts.push({x,y,vx:(Math.random()-.5)*140,vy:(Math.random()-.5)*140,l:.5,c})}
function step(dt){
 for(const s of stars){s.y+=s.s*20*dt;if(s.y>H)s.y=0}
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);
 if(state!='play')return;
 if(msg>0)msg--;
 let mv=0,fire=false;
 if(demo){const a=ai();mv=a.mv;fire=a.fire}
 else{mv=(keys.ArrowLeft||touchL?-1:0)+(keys.ArrowRight||touchR?1:0);fire=keys.Space||touchF;
  if(dragX!==null&&!touchL&&!touchR){const d=dragX-ship.x;mv=Math.abs(d)<4?0:Math.sign(d)}}
 ship.x=Math.max(20,Math.min(W-20,ship.x+mv*230*dt));
 if(ship.inv>0)ship.inv-=dt;
 cool-=dt;
 if(fire&&cool<=0&&bullets.length<2){bullets.push({x:ship.x,y:560});cool=.28}
 for(const b of bullets)b.y-=480*dt;bullets=bullets.filter(b=>b.y>-10);
 // invaders march
 const alive=inv.filter(i=>i.alive);
 if(!alive.length){level++;wave();return}
 const sp=spd*(1+(40-alive.length)/14);
 let minx=1e9,maxx=-1e9,maxy=0;for(const i of alive){minx=Math.min(minx,i.x);maxx=Math.max(maxx,i.x);maxy=Math.max(maxy,i.y)}
 let dx=dir*sp*dt;
 if((dir>0&&maxx+dx>W-24)||(dir<0&&minx+dx<24)){dir=-dir;for(const i of alive)i.y+=14;dx=0}
 for(const i of alive)i.x+=dx;
 if(maxy>540)return die(true);
 // enemy fire
 if(Math.random()<dt*(0.9+level*.35)){const cols={};for(const i of alive)if(!cols[i.x|0]||cols[i.x|0].y<i.y)cols[i.x|0]=i;
  const k=Object.values(cols);const s=k[Math.random()*k.length|0];ebullets.push({x:s.x,y:s.y+10})}
 for(const b of ebullets)b.y+=(170+level*10)*dt;ebullets=ebullets.filter(b=>b.y<H);
 // collisions
 for(const b of bullets){
  for(const i of alive)if(i.alive&&Math.abs(b.x-i.x)<11&&Math.abs(b.y-i.y)<9){i.alive=0;b.y=-99;score+=50-i.r*0+(4-i.r)*10;boom(i.x,i.y,COL[i.r]);break}
  for(const s of shields)if(s.hp>0&&b.y>0&&Math.abs(b.x-s.x-3)<5&&Math.abs(b.y-s.y-3)<5){s.hp--;b.y=-99;break}}
 for(const b of ebullets){
  for(const s of shields)if(s.hp>0&&Math.abs(b.x-s.x-3)<5&&Math.abs(b.y-s.y-3)<5){s.hp--;b.y=H+9;break}
  if(ship.inv<=0&&Math.abs(b.x-ship.x)<14&&Math.abs(b.y-566)<10){b.y=H+9;die()}}
 for(const i of alive)for(const s of shields)if(s.hp>0&&i.alive&&Math.abs(i.x-s.x-3)<12&&Math.abs(i.y-s.y-3)<10)s.hp=0;
 hi=Math.max(hi,score);
}
function die(all){boom(ship.x,566,'#fff');lives--;ebullets=[];ship.inv=1.8;
 if(all&&lives>0){inv.forEach(i=>i.y-=100)}
 if(lives<=0){state='over';overT=0}}
function ai(){
 // dodge bullets, else line up with lowest-reachable invader
 let mv=0;
 const danger=ebullets.filter(b=>b.y>470&&Math.abs(b.x-ship.x)<22).sort((a,b)=>b.y-a.y)[0];
 if(danger){mv=danger.x>=ship.x?-1:1;if(ship.x<40)mv=1;if(ship.x>W-40)mv=-1}
 else{const al=inv.filter(i=>i.alive);let t=al[0];
  for(const i of al)if(Math.abs(i.x-ship.x)<Math.abs(t.x-ship.x)-6||(Math.abs(Math.abs(i.x-ship.x)-Math.abs(t.x-ship.x))<=6&&i.y>t.y))t=i;
  if(t){const tx=t.x+dir*8;mv=Math.abs(tx-ship.x)<5?0:Math.sign(tx-ship.x)}}
 const al2=inv.some(i=>i.alive&&Math.abs(i.x-ship.x)<10);
 return{mv,fire:al2||Math.random()<.02}}
function draw(){
 g.fillStyle='#05060f';g.fillRect(0,0,W,H);
 for(const s of stars){g.fillStyle=`rgba(255,255,255,${.25+s.s*.5})`;g.fillRect(s.x,s.y,s.s>.7?2:1,s.s>.7?2:1)}
 for(const s of shields)if(s.hp>0){g.fillStyle=s.hp>1?'#3ddc84':'#2a9a5c';g.fillRect(s.x,s.y,6,6)}
 const t=performance.now()/400|0;
 for(const i of inv)if(i.alive){g.fillStyle=COL[i.r];const x=i.x-10,y=i.y-7,f=t&1;
  g.fillRect(x+3,y,14,9);g.fillRect(x,y+3,20,5);
  g.fillRect(x+(f?0:2),y+8,4,4);g.fillRect(x+16-(f?0:2),y+8,4,4);
  g.fillRect(x+5,y-3,2,3);g.fillRect(x+13,y-3,2,3);
  g.fillStyle='#05060f';g.fillRect(x+5,y+3,3,3);g.fillRect(x+12,y+3,3,3)}
 if(state=='play'&&(ship.inv<=0||(performance.now()/90|0)%2)){g.fillStyle='#5ec8ff';
  g.fillRect(ship.x-14,566,28,8);g.fillRect(ship.x-9,560,18,6);g.fillRect(ship.x-2,552,4,8)}
 g.fillStyle='#fff';for(const b of bullets)g.fillRect(b.x-1,b.y-6,3,10);
 g.fillStyle='#ff5e5e';for(const b of ebullets)g.fillRect(b.x-1,b.y-5,3,10);
 for(const p of parts){g.globalAlpha=Math.max(0,p.l*2);g.fillStyle=p.c;g.fillRect(p.x,p.y,3,3)}g.globalAlpha=1;
 g.font='bold 16px ui-monospace,Menlo,monospace';g.textBaseline='top';
 g.fillStyle='#e8ecff';g.textAlign='left';g.fillText('SCORE '+score,12,10);
 g.textAlign='right';g.fillText('LV '+level,W-12,10);
 g.textAlign='center';g.fillStyle='#8a93c8';g.fillText('HI '+hi,W/2,10);
 g.fillStyle='#1b2146';g.fillRect(0,580,W,1);
 for(let i=0;i<lives;i++){g.fillStyle='#5ec8ff';g.fillRect(14+i*0+i*0,0,0,0)}
 g.textAlign='left';g.fillStyle='#8a93c8';g.fillText('LIVES',12,34);
 for(let i=0;i<lives;i++){g.fillStyle='#5ec8ff';g.fillRect(70+i*22,38,16,6);g.fillRect(74+i*22,34,8,5)}
 if(!demo){ // touch buttons
  g.font='bold 20px sans-serif';g.textBaseline='middle';g.textAlign='center';
  for(const k of['l','r','f']){const b=BTN[k];g.fillStyle='rgba(94,200,255,.12)';g.strokeStyle='rgba(94,200,255,.4)';
   g.beginPath();g.roundRect(b.x,b.y,b.w,b.h,10);g.fill();g.stroke();
   g.fillStyle='#9fdcff';g.fillText(k=='l'?'◀':k=='r'?'▶':'FIRE',b.x+b.w/2,b.y+b.h/2)}}
 g.textBaseline='middle';g.textAlign='center';
 if(state=='play'&&msg>0){g.font='bold 22px ui-monospace,Menlo,monospace';g.fillStyle='#ffe66d';g.fillText('WAVE '+level,W/2,H/2)}
 if(demo){g.font='12px ui-monospace,Menlo,monospace';g.fillStyle='#8a93c8';g.fillText('DEMO',W/2,H-10)}
 if(state=='over'){g.fillStyle='rgba(5,6,15,.78)';g.fillRect(0,0,W,H);
  g.fillStyle='#ff5ea8';g.font='bold 38px ui-monospace,Menlo,monospace';g.fillText('GAME OVER',W/2,250);
  g.fillStyle='#e8ecff';g.font='18px ui-monospace,Menlo,monospace';g.fillText('Score '+score,W/2,305);
  g.fillStyle='#8a93c8';g.fillText('Best '+hi,W/2,333);
  if((performance.now()/500|0)%2||demo){g.fillStyle='#ffe66d';g.fillText(demo?'restarting...':'SPACE / TAP to restart',W/2,390)}}
}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;
 if(state=='over'){overT+=dt;if(demo&&overT>2.2)start()}
 step(dt);draw();requestAnimationFrame(loop)}
start();requestAnimationFrame(loop);
</script></body></html>

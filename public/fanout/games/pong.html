<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Pong</title>
<style>
html,body{margin:0;height:100%;background:#0b0e17;display:flex;align-items:center;justify-content:center}
canvas{width:360px;height:640px;max-height:100vh;background:#0f1424;border:2px solid #25305a;border-radius:8px;touch-action:none;box-shadow:0 0 30px #3b5bff33;cursor:none}
</style></head><body>
<canvas id="c" width="360" height="640"></canvas>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
const W=360,H=640,PW=70,PH=12,R=7,WIN=7;
const demo=new URLSearchParams(location.search).get('demo')==='1';
let p,a,b,sp,ps,as,over,msg,t=0,keys={},target=null,trail=[];
function reset(full){
  if(full){ps=0;as=0;over=false;}
  p=W/2;a=W/2;serve(Math.random()<.5?1:-1);
}
function serve(d){
  sp=300;const ang=(Math.random()-.5)*1.0;
  b={x:W/2,y:H/2,vx:Math.sin(ang)*sp,vy:Math.cos(ang)*sp*d};trail=[];wait=.7;
}
let wait=0;
function aiMove(px,paddleY,dt,speed,err){
  let tx=W/2;
  if((b.vy>0)===(paddleY>H/2))tx=b.x+err;
  const d=tx-px;return px+Math.max(-speed*dt,Math.min(speed*dt,d));
}
let aiErr=0;
function hit(pad,top){
  const rel=(b.x-pad)/(PW/2);
  const ang=rel*1.0;sp=Math.min(620,sp*1.06);
  b.vx=Math.sin(ang)*sp;b.vy=Math.cos(ang)*sp*(top?1:-1);
}
function update(dt){
  if(over){if(demo){over-=dt;if(over<-2.5)reset(true);}return;}
  // player
  if(demo)p=aiMove(p,H-30,dt,330,Math.sin(t*2)*18);
  else{
    if(keys.ArrowLeft)p-=420*dt;if(keys.ArrowRight)p+=420*dt;
    if(target!==null)p+=(target-p)*Math.min(1,dt*25);
  }
  a=aiMove(a,30,dt,demo?250:215,aiErr);
  p=Math.max(PW/2,Math.min(W-PW/2,p));a=Math.max(PW/2,Math.min(W-PW/2,a));
  if(wait>0){wait-=dt;return;}
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  trail.push({x:b.x,y:b.y});if(trail.length>10)trail.shift();
  if(b.x<R){b.x=R;b.vx=-b.vx}if(b.x>W-R){b.x=W-R;b.vx=-b.vx}
  if(b.vy>0&&b.y+R>=H-30-PH/2&&b.y<H-30+PH&&Math.abs(b.x-p)<PW/2+R){b.y=H-30-PH/2-R;hit(p,false)}
  if(b.vy<0&&b.y-R<=30+PH/2&&b.y>30-PH&&Math.abs(b.x-a)<PW/2+R){b.y=30+PH/2+R;hit(a,true);aiErr=(Math.random()-.5)*60}
  if(b.y<-R){ps++;check(-1)}
  else if(b.y>H+R){as++;check(1)}
}
function check(d){
  if(ps>=WIN||as>=WIN){over=demo?0:1;if(demo)over=0.001;msg=ps>=WIN?'YOU WIN':'GAME OVER';}
  else serve(d);
}
function draw(){
  x.clearRect(0,0,W,H);
  x.strokeStyle='#25305a';x.setLineDash([10,10]);x.beginPath();x.moveTo(0,H/2);x.lineTo(W,H/2);x.stroke();x.setLineDash([]);
  x.font='bold 64px system-ui,sans-serif';x.textAlign='center';x.fillStyle='#ffffff14';
  x.fillText(as,W/2,H/2-30);x.fillText(ps,W/2,H/2+80);
  trail.forEach((q,i)=>{x.fillStyle=`rgba(255,220,100,${i/trail.length*.3})`;x.beginPath();x.arc(q.x,q.y,R*i/trail.length,0,7);x.fill()});
  x.shadowColor='#5b8cff';x.shadowBlur=14;
  x.fillStyle='#ff6b81';rr(a-PW/2,30-PH/2);
  x.fillStyle='#5b8cff';rr(p-PW/2,H-30-PH/2);
  x.fillStyle='#ffe08a';x.shadowColor='#ffe08a';x.beginPath();x.arc(b.x,b.y,R,0,7);x.fill();
  x.shadowBlur=0;
  if(over){
    x.fillStyle='#000a';x.fillRect(0,0,W,H);x.fillStyle='#fff';
    x.font='bold 36px system-ui,sans-serif';x.fillText(msg,W/2,H/2-10);
    x.font='16px system-ui,sans-serif';x.fillStyle='#aab';
    x.fillText(demo?'restarting…':'Click / tap / press Space to restart',W/2,H/2+25);
  }else if(!demo&&ps+as===0&&t<4){x.font='14px system-ui,sans-serif';x.fillStyle='#aab';x.fillText('Arrows, mouse or drag to move · first to '+WIN,W/2,H-70)}
}
function rr(px,py){x.beginPath();x.roundRect(px,py,PW,PH,6);x.fill()}
let last=performance.now();
function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;t+=dt;update(dt);draw();requestAnimationFrame(loop)}
function pos(e){const r=cv.getBoundingClientRect();return (e.clientX-r.left)*W/r.width}
function restart(){if(over&&!demo)reset(true)}
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key.startsWith('Arrow'))e.preventDefault();if(e.key===' ')restart()});
addEventListener('keyup',e=>keys[e.key]=false);
cv.addEventListener('pointermove',e=>{target=pos(e)});
cv.addEventListener('pointerdown',e=>{target=pos(e);restart()});
reset(true);requestAnimationFrame(loop);
</script></body></html>

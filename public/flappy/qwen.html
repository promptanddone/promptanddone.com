<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }

        .game-container {
            text-align: center;
        }

        canvas {
            border: 3px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            background-color: #70c56b;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            color: white;
            font-size: 24px;
        }

        .overlay h1 {
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .start-btn {
            padding: 15px 30px;
            font-size: 20px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .start-btn:hover {
            background: #ff5252;
            transform: scale(1.05);
        }

        .score-display {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        .high-score {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            color: #ffeb3b;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .controls-hint {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div class="score-display" id="score">0</div>
        <div class="high-score" id="highScore">High Score: 0</div>
        <div class="controls-hint" id="controlsHint">Press SPACE or Click to flap</div>
        <div class="overlay" id="startOverlay">
            <h1>Flappy Bird!</h1>
            <button class="start-btn" onclick="toggleDemoMode()">Start Demo Mode</button>
            <p style="margin-top: 20px; font-size: 16px;">Press any key or click to flap</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startOverlay = document.getElementById('startOverlay');
        const scoreDisplay = document.getElementById('score');
        const highScoreDisplay = document.getElementById('highScore');
        const controlsHint = document.getElementById('controlsHint');
        const startButton = document.querySelector('.start-btn');

        // Game constants
        const GRAVITY = 0.25;
        const FLAP_STRENGTH = -5;
        const PIPE_WIDTH = 60;
        const PIPE_GAP = 140;
        const PIPE_SPEED = 2;
        const BIRD_SIZE = 34;
        const GROUND_HEIGHT = 50;

        // Game state
        let gameState = 'start'; // start, playing, gameover
        let score = 0;
        let highScore = localStorage.getItem('flappyHighScore') || 0;
        let demoMode = false;
        let frames = 0;

        // Bird object
        const bird = {
            x: canvas.width / 2 - BIRD_SIZE / 2,
            y: canvas.height / 2 - GROUND_HEIGHT - 150,
            width: BIRD_SIZE,
            height: BIRD_SIZE,
            velocity: 0,
            radius: BIRD_SIZE / 2,
            
            draw: function() {
                // Draw bird body
                ctx.fillStyle = '#f4d03f';
                ctx.beginPath();
                ctx.ellipse(
                    this.x + this.width/2, 
                    this.y + this.height/2, 
                    this.width/1.5, 
                    this.height/1.5, 
                    0, 0, Math.PI * 2
                );
                ctx.fill();

                // Draw beak
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath();
                ctx.moveTo(this.x + this.width - 5, this.y + this.height - 8);
                ctx.lineTo(this.x + this.width + 10, this.y + this.height - 2);
                ctx.lineTo(this.x + this.width - 5, this.y + this.height - 14);
                ctx.fill();

                // Draw eye
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(this.x + this.width - 8, this.y + 8, 6, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(this.x + this.width - 4, this.y + 8, 2, 0, Math.PI * 2);
                ctx.fill();

                // Draw wing
                ctx.fillStyle = '#f5cba7';
                ctx.beginPath();
                ctx.ellipse(
                    this.x + 12, 
                    this.y + 18, 
                    8, 
                    6, 
                    -0.2, 0, Math.PI * 2
                );
                ctx.fill();
            },

            flap: function() {
                this.velocity = FLAP_STRENGTH;
            },

            update: function() {
                this.velocity += GRAVITY;
                this.y += this.velocity;

                // Floor collision
                if (this.y + this.height >= canvas.height - GROUND_HEIGHT) {
                    this.y = canvas.height - GROUND_HEIGHT - this.height;
                    gameOver();
                }

                // Ceiling collision (optional - prevents flying over pipes)
                if (this.y < 0) {
                    this.y = 0;
                    this.velocity = 0;
                }
            },

            reset: function() {
                this.x = canvas.width / 2 - BIRD_SIZE / 2;
                this.y = canvas.height / 2 - GROUND_HEIGHT - 150;
                this.velocity = 0;
            }
        };

        // Pipes array
        let pipes = [];

        // Generate a new pipe
        function generatePipe() {
            const minPipeHeight = 50;
            const maxPipeHeight = canvas.height - GROUND_HEIGHT - PIPE_GAP - minPipeHeight - 50;
            const topPipeHeight = Math.floor(Math.random() * (maxPipeHeight - minPipeHeight + 1) + minPipeHeight);
            
            pipes.push({
                x: canvas.width,
                width: PIPE_WIDTH,
                topHeight: topPipeHeight,
                bottomY: topPipeHeight + PIPE_GAP,
                passed: false,
                color: '#2ecc71'
            });
        }

        // Update and draw pipes
        function updatePipes() {
            // Generate new pipe every 120 frames (about 2 seconds)
            if (frames % 120 === 0) {
                generatePipe();
            }

            // Move pipes and handle collisions
            for (let i = 0; i < pipes.length; i++) {
                const pipe = pipes[i];
                
                // Move pipe
                pipe.x -= PIPE_SPEED;

                // Collision detection with top pipe
                if (
                    bird.x + bird.width > pipe.x &&
                    bird.x < pipe.x + pipe.width &&
                    bird.y < pipe.topHeight
                ) {
                    gameOver();
                }

                // Collision detection with bottom pipe
                if (
                    bird.x + bird.width > pipe.x &&
                    bird.x < pipe.x + pipe.width &&
                    bird.y + bird.height > pipe.bottomY
                ) {
                    gameOver();
                }

                // Score update when passing a pipe
                if (!pipe.passed && pipe.x + pipe.width < bird.x) {
                    score++;
                    scoreDisplay.textContent = score;
                    pipe.passed = true;
                }

                // Remove off-screen pipes
                if (pipe.x + pipe.width < 0) {
                    pipes.splice(i, 1);
                    i--;
                }
            }
        }

        // Draw all pipes
        function drawPipes() {
            ctx.fillStyle = '#2ecc71';
            
            for (const pipe of pipes) {
                // Top pipe
                ctx.fillRect(pipe.x, 0, pipe.width, pipe.topHeight);
                
                // Top pipe cap
                ctx.fillStyle = '#27ae60';
                ctx.fillRect(
                    pipe.x - 4, 
                    pipe.topHeight - 20, 
                    pipe.width + 8, 
                    20
                );
                
                // Bottom pipe
                ctx.fillStyle = '#2ecc71';
                ctx.fillRect(pipe.x, pipe.bottomY, pipe.width, canvas.height - pipe.bottomY - GROUND_HEIGHT);
                
                // Bottom pipe cap
                ctx.fillStyle = '#27ae60';
                ctx.fillRect(
                    pipe.x - 4, 
                    pipe.bottomY, 
                    pipe.width + 8, 
                    20
                );

                ctx.fillStyle = '#2ecc71';
            }
        }

        // Draw ground
        function drawGround() {
            const groundTop = canvas.height - GROUND_HEIGHT;
            
            // Main ground area
            ctx.fillStyle = '#8bc34a';
            ctx.fillRect(0, groundTop, canvas.width, GROUND_HEIGHT);
            
            // Ground pattern
            ctx.strokeStyle = '#76b92a';
            ctx.lineWidth = 2;
            for (let i = 0; i < canvas.width + 20; i += 20) {
                ctx.beginPath();
                ctx.moveTo(i - (canvas.width % 20), groundTop);
                ctx.lineTo(i - (canvas.width % 20) - 10, groundTop + GROUND_HEIGHT);
                ctx.stroke();
            }

            // Border at top of ground
            ctx.fillStyle = '#689f38';
            ctx.fillRect(0, groundTop, canvas.width, 5);
        }

        // Draw background clouds
        function drawBackground() {
            const cloudPositions = [
                { x: -20 + (score * 40) % 460, y: 80 },
                { x: 300 + (score * 20) % 460, y: 150 },
                { x: 100 + (score * 30) % 460, y: 120 }
            ];

            for (const cloud of cloudPositions) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, 30, 0, Math.PI * 2);
                ctx.arc(cloud.x + 25, cloud.y - 10, 35, 0, Math.PI * 2);
                ctx.arc(cloud.x + 50, cloud.y, 30, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Game over function
        function gameOver() {
            gameState = 'gameover';
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('flappyHighScore', highScore);
            }
            
            controlsHint.textContent = "GAME OVER! Press R or Click to restart";
        }

        // Toggle demo mode
        function toggleDemoMode() {
            if (gameState !== 'start') {
                resetGame();
            }
            
            gameState = 'playing';
            startOverlay.style.display = 'none';
            controlsHint.textContent = "DEMO MODE: Press any key to stop";
            demoMode = !demoMode;
        }

        // Reset game
        function resetGame() {
            bird.reset();
            pipes = [];
            score = 0;
            frames = 0;
            scoreDisplay.textContent = '0';
            highScoreDisplay.textContent = `High Score: ${highScore}`;
            
            if (demoMode) {
                controlsHint.textContent = "DEMO MODE ACTIVE - Press SPACE or Click to stop";
            } else {
                controlsHint.textContent = "Press SPACE or Click to flap";
            }
        }

        // Main game loop
        function gameLoop() {
            // Clear canvas
            ctx.fillStyle = '#70c56b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw background
            drawBackground();

            // Draw pipes (before ground)
            drawPipes();

            // Draw bird (before ground, but after pipes for collision z-depth)
            if (gameState === 'playing' || gameState === 'start') {
                bird.draw();
            }

            // Update and draw pipes (after bird for proper rendering order)
            updatePipes();
            
            // Draw ground
            drawGround();

            // Update game state
            if (gameState === 'playing') {
                frames++;
                
                if (!demoMode) {
                    bird.update();
                } else {
                    // Demo mode: fly automatically towards the middle of a gap
                    if (pipes.length > 0) {
                        const lastPipe = pipes[pipes.length - 1];
                        const targetX = lastPipe.x + PIPE_WIDTH / 2;
                        const targetY = (lastPipe.topHeight + lastPipe.bottomY) / 2;
                        
                        // Smoothly move bird towards demo target position
                        if (bird.x < targetX - 5) {
                            bird.x += 2;
                            bird.y -= 1.5;
                            bird.velocity = -1.5;
                        } else if (bird.x > targetX + 5) {
                            bird.x -= 2;
                            bird.y += 1.5;
                            bird.velocity = 1.5;
                        } else if (bird.y < targetY - 5) {
                            bird.y -= 1;
                            bird.velocity = -1;
                        } else if (bird.y > targetY + 5) {
                            bird.y += 1;
                            bird.velocity = 1;
                        }
                    }

                    // Demo mode exit key
                    if (demoMode) {
                        document.onkeydown = function(e) {
                            if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) {
                                e.preventDefault();
                                resetGame();
                            }
                        };
                        document.onclick = function() {
                            if (demoMode) {
                                resetGame();
                            }
                        };
                    } else {
                        // Normal gameplay input
                        document.onkeydown = function(e) {
                            if (e.code === 'Space') {
                                e.preventDefault();
                                bird.flap();
                            }
                        };
                        canvas.onclick = function() {
                            bird.flap();
                        };
                    }
                }
            }

            requestAnimationFrame(gameLoop);
        }

        // Initialize and start
        highScoreDisplay.textContent = `High Score: ${highScore}`;
        gameLoop();
    </script>
</body>
</html>

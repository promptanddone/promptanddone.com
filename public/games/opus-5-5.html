<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1328">
<title>Path Keepers — Tower Defense</title>
<style>
  html,body{margin:0;height:100%;background:#0d1328;overflow:hidden;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;position:fixed;left:0;top:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// ---------- Layout (logical units; scaled to fit any screen) ----------
const W = 360, H = 640, CS = 40, COLS = 9, ROWS = 13, TOP = 52, GH = ROWS * CS, BOT = TOP + GH;
const MAXW = 25;
const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let sc = 1, ox = 0, oy = 0, dpr = 1, bg = null;

// ---------- Path ----------
const WP = [[-1,1],[7,1],[7,4],[1,4],[1,7],[7,7],[7,10],[1,10],[1,12],[9,12]];
const cx = c => c * CS + CS / 2, cy = r => TOP + r * CS + CS / 2;
const PTS = WP.map(([c, r]) => ({ x: cx(c), y: cy(r) }));
const SEG = []; let PL = 0;
for (let i = 0; i < PTS.length - 1; i++) {
  const a = PTS[i], b = PTS[i + 1], len = Math.hypot(b.x - a.x, b.y - a.y);
  SEG.push({ a, b, len, start: PL }); PL += len;
}
function posAt(d) {
  for (const s of SEG) if (d <= s.start + s.len) {
    const t = (d - s.start) / s.len;
    return { x: s.a.x + (s.b.x - s.a.x) * t, y: s.a.y + (s.b.y - s.a.y) * t, dx: Math.sign(s.b.x - s.a.x), dy: Math.sign(s.b.y - s.a.y) };
  }
  const l = PTS[PTS.length - 1]; return { x: l.x, y: l.y, dx: 1, dy: 0 };
}
const PATHCELL = new Set();
for (let i = 0; i < WP.length - 1; i++) {
  let [c, r] = WP[i]; const [c2, r2] = WP[i + 1];
  const sc_ = Math.sign(c2 - c), sr = Math.sign(r2 - r);
  while (true) {
    if (c >= 0 && c < COLS && r >= 0 && r < ROWS) PATHCELL.add(c + ',' + r);
    if (c === c2 && r === r2) break;
    c += sc_; r += sr;
  }
}
const SAMPLES = [];
for (let d = 0; d < PL; d += 8) { const p = posAt(d); if (p.x > 0 && p.x < W) SAMPLES.push({ x: p.x, y: p.y, d }); }

// ---------- Definitions ----------
const TT = {
  rapid:  { name: 'Rapid',  cost: 50, range: 2.3, rate: 0.22, dmg: 6,  color: '#38e1ff', dark: '#0b6f86', key: '1' },
  splash: { name: 'Splash', cost: 90, range: 2.6, rate: 1.35, dmg: 24, splash: 50, color: '#ff9a3c', dark: '#8a4a12', key: '2' },
  slow:   { name: 'Frost',  cost: 60, range: 2.0, rate: 0.9,  dmg: 3,  slow: 0.5, slowT: 1.6, color: '#b49bff', dark: '#4b3a9a', key: '3' },
};
const TKEYS = ['rapid', 'splash', 'slow'];
const ET = {
  grunt:  { hp: 32,  spd: 42, gold: 5,  r: 9,  color: '#7be36b', dark: '#2f7a2a' },
  runner: { hp: 18,  spd: 82, gold: 4,  r: 7,  color: '#ffe05c', dark: '#9a7c10' },
  tank:   { hp: 120, spd: 27, gold: 12, r: 12, color: '#ff5d73', dark: '#8f1f33' },
  boss:   { hp: 650, spd: 23, gold: 60, r: 16, color: '#e45cff', dark: '#6f1a85' },
};
function stats(t) {
  const d = TT[t.type], k = t.lvl - 1;
  return { range: d.range * CS * (1 + 0.12 * k), rate: d.rate * (1 - 0.12 * k), dmg: d.dmg * (1 + 0.75 * k),
           slow: d.slow ? d.slow - 0.08 * k : 0, splash: d.splash ? d.splash * (1 + 0.1 * k) : 0 };
}
const upCost = t => Math.round(TT[t.type].cost * 0.8 * t.lvl);
const sellVal = t => Math.floor(t.spent * 0.7);

// ---------- State ----------
let S;
function newGame(demo) {
  S = { demo, gold: 150, lives: 20, wave: 0, towers: [], enemies: [], shots: [], parts: [], texts: [], rings: [],
        queue: [], spawnT: 0, waveActive: false, nextT: demo ? 2 : Infinity, build: null, sel: null, hover: null,
        speed: 1, over: false, win: false, t: 0, overT: 0, aiT: 1, aiPlan: 0, shake: 0, grid: new Map() };
}

function genWave(n) {
  const q = [], cnt = 6 + Math.floor(n * 1.6);
  for (let i = 0; i < cnt; i++) {
    const r = Math.random(); let t = 'grunt';
    if (n >= 3 && r < 0.3) t = 'runner';
    else if (n >= 5 && r > 0.8 - Math.min(0.2, n * 0.006)) t = 'tank';
    q.push(t);
  }
  if (n % 4 === 0) for (let i = 0; i < 4 + n / 2; i++) q.push('runner');
  if (n % 5 === 0) for (let i = 0; i < n / 5; i++) q.push('boss');
  return q;
}
function startWave() {
  if (S.waveActive || S.over || S.wave >= MAXW) return;
  S.wave++; S.queue = genWave(S.wave); S.spawnT = 0.3; S.waveActive = true; S.nextT = Infinity;
  addText(W / 2, TOP + GH / 2, 'WAVE ' + S.wave, '#fff', 26, 1.4);
}
function spawn(type) {
  const d = ET[type], n = S.wave, hpm = 1 + (n - 1) * 0.35 + (n - 1) * (n - 1) * 0.03;
  const hp = Math.round(d.hp * hpm);
  S.enemies.push({ type, hp, max: hp, spd: d.spd * (1 + n * 0.006), gold: d.gold + Math.floor(n / 8), r: d.r,
                   color: d.color, dark: d.dark, d: 0, x: -20, y: cy(1), dx: 1, dy: 0, slowT: 0, slowF: 1, dead: false,
                   wob: Math.random() * 6, hitT: 0 });
}

// ---------- Actions ----------
function canPlace(c, r) {
  return c >= 0 && c < COLS && r >= 0 && r < ROWS && !PATHCELL.has(c + ',' + r) && !S.grid.has(c + ',' + r);
}
function place(type, c, r) {
  const d = TT[type];
  if (!canPlace(c, r) || S.gold < d.cost) return false;
  const t = { type, c, r, x: cx(c), y: cy(r), lvl: 1, cd: 0, ang: -Math.PI / 2, spent: d.cost, recoil: 0, spin: 0 };
  S.towers.push(t); S.grid.set(c + ',' + r, t); S.gold -= d.cost;
  S.rings.push({ x: t.x, y: t.y, r: 4, max: 34, life: 0.4, t: 0, color: d.color });
  burst(t.x, t.y, d.color, 10, 70);
  return true;
}
function upgrade(t) {
  if (!t || t.lvl >= 3) return false;
  const c = upCost(t); if (S.gold < c) return false;
  S.gold -= c; t.spent += c; t.lvl++;
  S.rings.push({ x: t.x, y: t.y, r: 6, max: 30, life: 0.4, t: 0, color: '#fff' });
  burst(t.x, t.y, TT[t.type].color, 14, 90); addText(t.x, t.y - 18, 'LV ' + t.lvl, '#fff', 13);
  return true;
}
function sell(t) {
  if (!t) return;
  S.gold += sellVal(t); addText(t.x, t.y - 14, '+' + sellVal(t), '#ffd54a', 13);
  S.towers.splice(S.towers.indexOf(t), 1); S.grid.delete(t.c + ',' + t.r);
  burst(t.x, t.y, '#aaa', 10, 60); S.sel = null;
}

// ---------- Effects ----------
function burst(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = spd * (0.3 + Math.random() * 0.7);
    S.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.3 + Math.random() * 0.4, t: 0, color, s: 1.5 + Math.random() * 2.5 });
  }
}
function addText(x, y, s, color, size = 12, life = 0.9) { S.texts.push({ x, y, s, color, size, life, t: 0 }); }

function hit(e, dmg) {
  if (e.dead) return;
  e.hp -= dmg; e.hitT = 0.08;
  if (e.hp <= 0) {
    e.dead = true; S.gold += e.gold;
    addText(e.x, e.y - 10, '+' + e.gold, '#ffd54a', e.type === 'boss' ? 16 : 11);
    burst(e.x, e.y, e.color, e.type === 'boss' ? 40 : 12, e.type === 'boss' ? 160 : 90);
    if (e.type === 'boss') S.shake = 0.35;
  }
}

// ---------- Update ----------
function update(dt) {
  S.t += dt;
  if (S.over) { S.overT += dt; if (S.demo && S.overT > 4) newGame(true); updateFx(dt); return; }
  if (S.demo) ai(dt);

  // spawning / wave flow
  if (S.waveActive) {
    S.spawnT -= dt;
    if (S.queue.length && S.spawnT <= 0) {
      const t = S.queue.shift(); spawn(t);
      const nxt = S.queue[0];
      S.spawnT = nxt === 'runner' ? 0.38 : nxt === 'tank' ? 1.0 : nxt === 'boss' ? 1.8 : 0.7;
    }
    if (!S.queue.length && !S.enemies.length) {
      S.waveActive = false;
      const bonus = 15 + S.wave * 2; S.gold += bonus;
      addText(W / 2, TOP + GH / 2, 'Wave cleared  +' + bonus, '#ffd54a', 18, 1.6);
      if (S.wave >= MAXW) { S.over = true; S.win = true; S.overT = 0; }
      else S.nextT = S.demo ? 2.5 : 12;
    }
  } else if (S.wave < MAXW) {
    S.nextT -= dt; if (S.nextT <= 0) startWave();
  }

  // enemies
  for (const e of S.enemies) {
    if (e.slowT > 0) e.slowT -= dt; else e.slowF = 1;
    if (e.hitT > 0) e.hitT -= dt;
    e.d += e.spd * e.slowF * dt;
    const p = posAt(e.d); e.x = p.x; e.y = p.y; e.dx = p.dx; e.dy = p.dy;
    if (e.d >= PL) {
      e.dead = true; e.leaked = true;
      S.lives -= e.type === 'boss' ? 5 : 1; S.shake = 0.25;
      addText(W - 30, BOT - 30, '-' + (e.type === 'boss' ? 5 : 1) + ' ♥', '#ff5d73', 14);
      if (S.lives <= 0) { S.lives = 0; S.over = true; S.win = false; S.overT = 0; }
    }
  }
  S.enemies = S.enemies.filter(e => !e.dead);

  // towers
  for (const t of S.towers) {
    const st = stats(t); t.cd -= dt; t.recoil = Math.max(0, t.recoil - dt * 6); t.spin += dt * 1.5;
    let best = null;
    for (const e of S.enemies) {
      if ((e.x - t.x) ** 2 + (e.y - t.y) ** 2 <= st.range * st.range && (!best || e.d > best.d)) best = e;
    }
    if (!best) continue;
    const want = Math.atan2(best.y - t.y, best.x - t.x);
    let da = ((want - t.ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    t.ang += da * Math.min(1, dt * 14);
    if (t.cd > 0) continue;
    t.cd = st.rate; t.recoil = 1;
    if (t.type === 'rapid') {
      const side = (t.flip = !t.flip) ? 1 : -1;
      const ox_ = Math.cos(t.ang + Math.PI / 2) * 3 * side, oy_ = Math.sin(t.ang + Math.PI / 2) * 3 * side;
      S.shots.push({ k: 'b', x: t.x + Math.cos(t.ang) * 14 + ox_, y: t.y + Math.sin(t.ang) * 14 + oy_, tgt: best, dmg: st.dmg, color: TT.rapid.color });
    } else if (t.type === 'splash') {
      const lead = posAt(best.d + best.spd * best.slowF * 0.45);
      S.shots.push({ k: 's', sx: t.x, sy: t.y, tx: lead.x, ty: lead.y, t: 0, dur: 0.45, dmg: st.dmg, rad: st.splash, x: t.x, y: t.y });
    } else {
      S.rings.push({ x: t.x, y: t.y, r: 8, max: st.range, life: 0.45, t: 0, color: TT.slow.color, fill: true });
      for (const e of S.enemies) {
        if ((e.x - t.x) ** 2 + (e.y - t.y) ** 2 <= st.range * st.range) {
          e.slowF = Math.min(e.slowF, e.type === 'boss' ? 1 - (1 - st.slow) * 0.6 : st.slow);
          e.slowT = TT.slow.slowT; hit(e, st.dmg);
        }
      }
    }
  }

  // shots
  for (const s of S.shots) {
    if (s.k === 'b') {
      const tx = s.tgt.x, ty = s.tgt.y, dx = tx - s.x, dy = ty - s.y, dist = Math.hypot(dx, dy), step = 560 * dt;
      s.px = s.x; s.py = s.y;
      if (dist <= step + s.tgt.r * 0.5) { if (!s.tgt.dead) hit(s.tgt, s.dmg); s.done = true; burst(tx, ty, s.color, 2, 40); }
      else { s.x += dx / dist * step; s.y += dy / dist * step; }
      if (s.tgt.dead && !s.done) { s.life = (s.life || 0) + dt; if (s.life > 0.2) s.done = true; }
    } else {
      s.t += dt; const k = Math.min(1, s.t / s.dur);
      s.x = s.sx + (s.tx - s.sx) * k; s.y = s.sy + (s.ty - s.sy) * k; s.h = Math.sin(k * Math.PI) * 26;
      if (k >= 1) {
        s.done = true;
        for (const e of S.enemies) {
          const dd = Math.hypot(e.x - s.tx, e.y - s.ty);
          if (dd <= s.rad + e.r) hit(e, s.dmg * (dd < s.rad * 0.4 ? 1 : 0.65));
        }
        S.rings.push({ x: s.tx, y: s.ty, r: 6, max: s.rad, life: 0.3, t: 0, color: '#ffb35c', fill: true });
        burst(s.tx, s.ty, '#ffb35c', 14, 120); burst(s.tx, s.ty, '#ff5b2e', 8, 70);
      }
    }
  }
  S.shots = S.shots.filter(s => !s.done);
  S.enemies = S.enemies.filter(e => !e.dead);
  updateFx(dt);
}
function updateFx(dt) {
  for (const p of S.parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; }
  S.parts = S.parts.filter(p => p.t < p.life);
  for (const x of S.texts) { x.t += dt; x.y -= 22 * dt; }
  S.texts = S.texts.filter(x => x.t < x.life);
  for (const r of S.rings) r.t += dt;
  S.rings = S.rings.filter(r => r.t < r.life);
  if (S.shake > 0) S.shake -= dt;
}

// ---------- Demo AI ----------
const PLAN = ['rapid', 'rapid', 'slow', 'splash', 'rapid', 'up', 'splash', 'slow', 'up', 'splash', 'up', 'rapid', 'up', 'up'];
const LOOP = ['splash', 'up', 'up', 'rapid', 'up', 'slow', 'up', 'up', 'splash', 'up'];
function bestSpot(type) {
  const R = TT[type].range * CS; let best = null, bs = -1;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (!canPlace(c, r)) continue;
    const x = cx(c), y = cy(r); let s = 0;
    for (const p of SAMPLES) if ((p.x - x) ** 2 + (p.y - y) ** 2 <= R * R) s += type === 'slow' ? 1.5 - p.d / PL : 1;
    s += Math.random() * 1.5;
    if (s > bs) { bs = s; best = { c, r }; }
  }
  return bs > 12 ? best : null;
}
function ai(dt) {
  if (!S.waveActive) S.nextT = Math.min(S.nextT, 3);
  S.aiT -= dt; if (S.aiT > 0) return; S.aiT = 0.45;
  const step = S.aiPlan < PLAN.length ? PLAN[S.aiPlan] : LOOP[(S.aiPlan - PLAN.length) % LOOP.length];
  if (step === 'up') {
    const cand = S.towers.filter(t => t.lvl < 3).sort((a, b) => upCost(a) - upCost(b))[0];
    if (!cand) { S.aiPlan++; return; }
    if (upgrade(cand)) { S.aiPlan++; S.sel = cand; S.selT = 0.8; }
  } else if (S.gold >= TT[step].cost) {
    const spot = bestSpot(step);
    if (spot) place(step, spot.c, spot.r);
    S.aiPlan++;
  }
}

// ---------- Rendering ----------
function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function buildBg() {
  bg = document.createElement('canvas');
  const k = sc * dpr; bg.width = Math.ceil(W * k); bg.height = Math.ceil(H * k);
  const g = bg.getContext('2d'); g.scale(k, k);
  const rnd = mulberry(7);
  g.fillStyle = '#0d1328'; g.fillRect(0, 0, W, H);
  g.save(); g.beginPath(); g.rect(0, TOP, W, GH); g.clip();
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const l = 30 + ((r + c) % 2) * 2.5 + rnd() * 2;
    g.fillStyle = `hsl(${135 + rnd() * 10},38%,${l}%)`; g.fillRect(c * CS, TOP + r * CS, CS, CS);
  }
  for (let i = 0; i < 260; i++) {
    const x = rnd() * W, y = TOP + rnd() * GH;
    g.fillStyle = rnd() < 0.85 ? 'rgba(20,60,30,.35)' : ['#ffd1e8', '#fff3a0', '#c9e8ff'][(rnd() * 3) | 0];
    g.fillRect(x, y, rnd() < 0.85 ? 2 : 2.5, rnd() < 0.85 ? 3 : 2.5);
  }
  // path
  const line = (w, col, dy = 0) => {
    g.beginPath(); PTS.forEach((p, i) => i ? g.lineTo(p.x, p.y + dy) : g.moveTo(p.x, p.y + dy));
    g.lineWidth = w; g.strokeStyle = col; g.lineJoin = 'round'; g.lineCap = 'butt'; g.stroke();
  };
  line(38, 'rgba(0,0,0,.28)', 3); line(36, '#6b4f2a'); line(30, '#b98d55'); line(22, '#c99d63');
  g.setLineDash([2, 10]); line(4, 'rgba(255,240,210,.18)'); g.setLineDash([]);
  for (let i = 0; i < 120; i++) {
    const p = posAt(rnd() * PL);
    g.fillStyle = rnd() < 0.5 ? 'rgba(90,60,30,.35)' : 'rgba(255,230,190,.25)';
    g.beginPath(); g.arc(p.x + (rnd() - 0.5) * 24, p.y + (rnd() - 0.5) * 24, 1 + rnd() * 1.5, 0, 7); g.fill();
  }
  // subtle buildable grid
  g.strokeStyle = 'rgba(255,255,255,.05)'; g.lineWidth = 1;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
    if (!PATHCELL.has(c + ',' + r)) g.strokeRect(c * CS + 0.5, TOP + r * CS + 0.5, CS - 1, CS - 1);
  // vignette
  const vg = g.createRadialGradient(W / 2, TOP + GH / 2, GH * 0.3, W / 2, TOP + GH / 2, GH * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.35)');
  g.fillStyle = vg; g.fillRect(0, TOP, W, GH);
  g.restore();
  // exit portal
  const ex = W - 6, ey = cy(12);
  const pg = g.createRadialGradient(ex, ey, 2, ex, ey, 24);
  pg.addColorStop(0, 'rgba(255,90,120,.8)'); pg.addColorStop(1, 'rgba(255,90,120,0)');
  g.fillStyle = pg; g.fillRect(ex - 24, ey - 24, 30, 48);
  // panels
  const pnl = (y, h) => {
    const gr = g.createLinearGradient(0, y, 0, y + h); gr.addColorStop(0, '#1a2347'); gr.addColorStop(1, '#111833');
    g.fillStyle = gr; g.fillRect(0, y, W, h);
  };
  pnl(0, TOP); pnl(BOT, H - BOT);
  g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(0, TOP - 1, W, 1); g.fillRect(0, BOT, W, 1);
}

function drawTowerShape(g, type, x, y, ang, lvl, recoil, spin, alpha = 1) {
  const d = TT[type]; g.save(); g.globalAlpha = alpha; g.translate(x, y);
  // base plate
  g.fillStyle = 'rgba(0,0,0,.3)'; rr(g, -15, -13, 30, 30, 7); g.fill();
  g.fillStyle = '#3a4466'; rr(g, -15, -15, 30, 30, 7); g.fill();
  g.fillStyle = '#4c5880'; rr(g, -13, -13, 26, 24, 6); g.fill();
  if (type === 'slow') {
    g.rotate(spin);
    const s = 9 + lvl;
    g.fillStyle = d.dark; g.beginPath(); g.moveTo(0, -s - 2); g.lineTo(s * 0.7, 0); g.lineTo(0, s + 2); g.lineTo(-s * 0.7, 0); g.closePath(); g.fill();
    g.fillStyle = d.color; g.beginPath(); g.moveTo(0, -s); g.lineTo(s * 0.55, 0); g.lineTo(0, s); g.lineTo(-s * 0.55, 0); g.closePath(); g.fill();
    g.rotate(Math.PI / 2); g.globalAlpha = alpha * 0.7;
    g.beginPath(); g.moveTo(0, -s * 0.8); g.lineTo(s * 0.4, 0); g.lineTo(0, s * 0.8); g.lineTo(-s * 0.4, 0); g.closePath(); g.fill();
    g.globalAlpha = alpha; g.fillStyle = '#fff'; g.beginPath(); g.arc(0, 0, 2.5, 0, 7); g.fill();
  } else {
    g.rotate(ang);
    const rc = recoil * 3;
    g.fillStyle = '#222a44';
    if (type === 'rapid') { g.fillRect(2 - rc, -5, 15, 3.4); g.fillRect(2 - rc, 1.6, 15, 3.4); }
    else { rr(g, 0 - rc, -5.5, 16, 11, 3); g.fill(); g.fillStyle = d.dark; g.fillRect(12 - rc, -6.5, 5, 13); }
    g.fillStyle = d.dark; g.beginPath(); g.arc(0, 0, type === 'splash' ? 10.5 : 9, 0, 7); g.fill();
    g.fillStyle = d.color; g.beginPath(); g.arc(-1, -1, type === 'splash' ? 8.5 : 7, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,255,255,.45)'; g.beginPath(); g.arc(-3, -3, 2.5, 0, 7); g.fill();
  }
  g.restore();
  if (lvl > 1) {
    g.save(); g.globalAlpha = alpha;
    for (let i = 0; i < lvl; i++) { g.fillStyle = '#ffd54a'; g.beginPath(); g.arc(x - (lvl - 1) * 3.5 + i * 7, y + 12, 2.2, 0, 7); g.fill(); }
    g.restore();
  }
}

function drawEnemy(e) {
  const g = ctx, bob = Math.sin(S.t * 10 + e.wob) * (e.type === 'runner' ? 1.5 : 1);
  const x = e.x, y = e.y + bob;
  g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(e.x, e.y + e.r * 0.8, e.r, e.r * 0.4, 0, 0, 7); g.fill();
  const col = e.hitT > 0 ? '#fff' : e.color;
  g.fillStyle = e.dark;
  if (e.type === 'tank') { rr(g, x - e.r, y - e.r, e.r * 2, e.r * 2, 5); g.fill(); g.fillStyle = col; rr(g, x - e.r + 2, y - e.r + 1, e.r * 2 - 4, e.r * 2 - 5, 4); g.fill(); }
  else {
    g.beginPath(); g.arc(x, y, e.r, 0, 7); g.fill();
    g.fillStyle = col; g.beginPath(); g.arc(x - 0.5, y - 1, e.r - 1.8, 0, 7); g.fill();
  }
  if (e.type === 'boss') {
    g.fillStyle = '#ffd54a'; g.beginPath();
    g.moveTo(x - 9, y - 12); g.lineTo(x - 9, y - 21); g.lineTo(x - 4.5, y - 15); g.lineTo(x, y - 23); g.lineTo(x + 4.5, y - 15); g.lineTo(x + 9, y - 21); g.lineTo(x + 9, y - 12); g.closePath(); g.fill();
  }
  // eyes look along travel direction
  const ex = e.dx * e.r * 0.3, ey = e.dy * e.r * 0.3, es = Math.max(2, e.r * 0.28);
  for (const s of [-1, 1]) {
    const px = x + ex + (e.dy ? s * e.r * 0.35 : 0) + (e.dx ? 0 : 0), py = y - 1 + ey + (e.dx ? s * e.r * 0.35 : 0) - (e.dx ? 0 : 0);
    g.fillStyle = '#fff'; g.beginPath(); g.arc(px, py, es, 0, 7); g.fill();
    g.fillStyle = '#111'; g.beginPath(); g.arc(px + e.dx * es * 0.4, py + e.dy * es * 0.4, es * 0.5, 0, 7); g.fill();
  }
  if (e.slowF < 1) { g.strokeStyle = 'rgba(180,200,255,.85)'; g.lineWidth = 1.5; g.beginPath(); g.arc(x, y, e.r + 2.5, 0, 7); g.stroke(); }
  if (e.hp < e.max) {
    const w = e.r * 2 + 4, k = Math.max(0, e.hp / e.max);
    g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(x - w / 2, y - e.r - 8, w, 3.5);
    g.fillStyle = k > 0.5 ? '#6cf06c' : k > 0.25 ? '#ffd54a' : '#ff5d73'; g.fillRect(x - w / 2, y - e.r - 8, w * k, 3.5);
  }
}

let UI = [];
function button(x, y, w, h, act, drawFn, enabled = true, active = false) {
  const g = ctx;
  g.fillStyle = active ? 'rgba(255,255,255,.22)' : 'rgba(255,255,255,.07)'; rr(g, x, y, w, h, 10); g.fill();
  g.strokeStyle = active ? 'rgba(255,255,255,.8)' : 'rgba(255,255,255,.14)'; g.lineWidth = active ? 2 : 1; rr(g, x + 0.5, y + 0.5, w - 1, h - 1, 10); g.stroke();
  g.save(); if (!enabled) g.globalAlpha = 0.4; drawFn(x, y, w, h); g.restore();
  UI.push({ x, y, w, h, act });
}
function txt(s, x, y, size, color, align = 'left', weight = '700') {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function coin(x, y, r = 6) {
  ctx.fillStyle = '#b8860b'; ctx.beginPath(); ctx.arc(x, y + 0.8, r, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffd54a'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff3b0'; ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.3, 0, 7); ctx.fill();
}
function heart(x, y, s = 7) {
  ctx.fillStyle = '#ff5d73'; ctx.beginPath(); ctx.moveTo(x, y + s * 0.9);
  ctx.bezierCurveTo(x - s * 1.5, y - s * 0.2, x - s * 0.6, y - s * 1.3, x, y - s * 0.4);
  ctx.bezierCurveTo(x + s * 0.6, y - s * 1.3, x + s * 1.5, y - s * 0.2, x, y + s * 0.9); ctx.fill();
}

function draw() {
  const g = ctx; UI = [];
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#0d1328'; g.fillRect(0, 0, cv.width, cv.height);
  const sh = S.shake > 0 ? S.shake * 14 : 0;
  g.setTransform(sc * dpr, 0, 0, sc * dpr, (ox + (Math.random() - 0.5) * sh) * dpr, (oy + (Math.random() - 0.5) * sh) * dpr);
  g.drawImage(bg, 0, 0, W, H);

  g.save(); g.beginPath(); g.rect(0, TOP, W, GH); g.clip();
  // spawn portal pulse
  const pr = 14 + Math.sin(S.t * 4) * 2;
  g.fillStyle = 'rgba(120,255,160,.25)'; g.beginPath(); g.arc(4, cy(1), pr, 0, 7); g.fill();

  // selected tower range / placement ghost
  const sel = S.sel;
  if (sel) {
    const st = stats(sel);
    g.fillStyle = 'rgba(255,255,255,.08)'; g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 1.5;
    g.beginPath(); g.arc(sel.x, sel.y, st.range, 0, 7); g.fill(); g.stroke();
  }
  if (S.build && S.hover) {
    const { c, r } = S.hover, ok = canPlace(c, r) && S.gold >= TT[S.build].cost, x = cx(c), y = cy(r);
    g.fillStyle = ok ? 'rgba(120,255,140,.12)' : 'rgba(255,80,80,.15)'; g.strokeStyle = ok ? 'rgba(160,255,170,.7)' : 'rgba(255,100,100,.7)';
    g.beginPath(); g.arc(x, y, TT[S.build].range * CS, 0, 7); g.fill(); g.stroke();
    drawTowerShape(g, S.build, x, y, -Math.PI / 2, 1, 0, S.t, 0.6);
  }

  for (const r of S.rings) if (r.fill) {
    const k = r.t / r.life; g.globalAlpha = (1 - k) * 0.35; g.fillStyle = r.color;
    g.beginPath(); g.arc(r.x, r.y, r.r + (r.max - r.r) * k, 0, 7); g.fill(); g.globalAlpha = 1;
  }
  // sort for fake depth
  S.enemies.sort((a, b) => a.y - b.y);
  for (const e of S.enemies) drawEnemy(e);
  for (const t of S.towers) drawTowerShape(g, t.type, t.x, t.y, t.ang, t.lvl, t.recoil, t.spin);

  // shots
  for (const s of S.shots) {
    if (s.k === 'b') {
      g.strokeStyle = s.color; g.lineWidth = 2.5; g.lineCap = 'round';
      g.beginPath(); g.moveTo(s.px ?? s.x, s.py ?? s.y); g.lineTo(s.x, s.y); g.stroke();
      g.fillStyle = '#e8fdff'; g.beginPath(); g.arc(s.x, s.y, 2, 0, 7); g.fill();
    } else {
      g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(s.x, s.y + 3, 4, 2, 0, 0, 7); g.fill();
      g.fillStyle = '#3a2412'; g.beginPath(); g.arc(s.x, s.y - s.h, 5, 0, 7); g.fill();
      g.fillStyle = '#ff9a3c'; g.beginPath(); g.arc(s.x - 1, s.y - s.h - 1, 2.5, 0, 7); g.fill();
    }
  }
  for (const r of S.rings) if (!r.fill) {
    const k = r.t / r.life; g.globalAlpha = 1 - k; g.strokeStyle = r.color; g.lineWidth = 2;
    g.beginPath(); g.arc(r.x, r.y, r.r + (r.max - r.r) * k, 0, 7); g.stroke(); g.globalAlpha = 1;
  }
  for (const p of S.parts) { g.globalAlpha = 1 - p.t / p.life; g.fillStyle = p.color; g.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); }
  g.globalAlpha = 1;
  for (const x of S.texts) {
    const k = x.t / x.life; g.globalAlpha = k > 0.6 ? (1 - k) / 0.4 : 1;
    g.font = `800 ${x.size}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = 3; g.strokeStyle = 'rgba(0,0,0,.6)'; g.strokeText(x.s, x.x, x.y); g.fillStyle = x.color; g.fillText(x.s, x.x, x.y);
  }
  g.globalAlpha = 1;
  g.restore();

  drawHud();
  drawOverlays();
}

function drawHud() {
  // top bar
  heart(18, 25, 7.5); txt(S.lives, 30, 26, 17, '#fff');
  coin(78, 26, 7); txt(S.gold, 90, 26, 17, '#ffd54a');
  txt('WAVE', 160, 19, 9, 'rgba(255,255,255,.55)', 'left', '700');
  txt(`${Math.max(1, S.wave)}/${MAXW}`, 160, 33, 15, '#fff');
  button(232, 9, 56, 34, () => { S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 3 : 1; }, (x, y, w, h) => {
    txt(S.speed + '×', x + w / 2, y + h / 2 + 1, 15, '#fff', 'center');
  }, true, S.speed > 1);
  if (S.waveActive) {
    const left = S.queue.length + S.enemies.length;
    txt(left + ' left', W - 12, 26, 12, 'rgba(255,255,255,.7)', 'right', '600');
  } else if (S.wave < MAXW && !S.over) {
    txt('NEXT', W - 12, 26, 12, 'rgba(255,255,255,.4)', 'right', '600');
  }

  // bottom bar
  const y = BOT + 7, h = H - BOT - 14;
  if (S.sel && !S.demo) {
    const t = S.sel, st = stats(t), d = TT[t.type];
    g2box(6, y, 130, h);
    txt(`${d.name}  Lv ${t.lvl}`, 16, y + 16, 13, d.color);
    txt(`DMG ${st.dmg.toFixed(0)} · RNG ${(st.range / CS).toFixed(1)}`, 16, y + 34, 10, 'rgba(255,255,255,.75)', 'left', '600');
    txt(`${(1 / st.rate).toFixed(1)} shots/s${d.slow ? ' · slow ' + Math.round((1 - st.slow) * 100) + '%' : ''}`, 16, y + 47, 10, 'rgba(255,255,255,.55)', 'left', '600');
    const uc = upCost(t), canUp = t.lvl < 3 && S.gold >= uc;
    button(142, y, 104, h, () => upgrade(t), (x, yy, w, hh) => {
      txt(t.lvl < 3 ? 'UPGRADE' : 'MAX LEVEL', x + w / 2, yy + 19, 13, '#fff', 'center');
      if (t.lvl < 3) { coin(x + w / 2 - 14, yy + 38, 5.5); txt(uc, x + w / 2 - 5, yy + 38, 13, '#ffd54a'); }
    }, canUp);
    button(252, y, 102, h, () => sell(t), (x, yy, w, hh) => {
      txt('SELL', x + w / 2, yy + 19, 13, '#ff8b9b', 'center');
      coin(x + w / 2 - 14, yy + 38, 5.5); txt('+' + sellVal(t), x + w / 2 - 5, yy + 38, 13, '#ffd54a');
    });
  } else {
    TKEYS.forEach((k, i) => {
      const d = TT[k], x0 = 6 + i * 86;
      button(x0, y, 80, h, () => { S.build = S.build === k ? null : k; S.sel = null; }, (x, yy, w, hh) => {
        drawTowerShape(ctx, k, x + 21, yy + hh / 2, -Math.PI / 4, 1, 0, S.t);
        txt(d.name, x + 41, yy + 18, 12, '#fff');
        coin(x + 46, yy + 37, 5); txt(d.cost, x + 54, yy + 37, 12, '#ffd54a');
      }, S.gold >= d.cost, S.build === k);
    });
    const canGo = !S.waveActive && !S.over && S.wave < MAXW;
    button(264, y, 90, h, () => { if (canGo) { const early = isFinite(S.nextT) ? Math.ceil(S.nextT) : 0; if (early > 0 && S.wave > 0) { S.gold += early; addText(309, BOT - 14, '+' + early + ' early', '#ffd54a', 12); } startWave(); } },
      (x, yy, w, hh) => {
        const pulse = canGo && S.wave === 0 ? 0.5 + 0.5 * Math.sin(S.t * 5) : 0;
        if (canGo) { ctx.fillStyle = `rgba(90,220,120,${0.35 + pulse * 0.3})`; rr(ctx, x + 2, yy + 2, w - 4, hh - 4, 8); ctx.fill(); }
        txt(S.waveActive ? 'WAVE ' + S.wave : 'GO ▶', x + w / 2, yy + (canGo && isFinite(S.nextT) ? 21 : hh / 2 + 1), 16, '#fff', 'center', '800');
        if (canGo && isFinite(S.nextT)) txt('auto in ' + Math.ceil(S.nextT) + 's', x + w / 2, yy + 40, 10, 'rgba(255,255,255,.8)', 'center', '600');
      }, canGo);
  }
}
function g2box(x, y, w, h) { ctx.fillStyle = 'rgba(0,0,0,.25)'; rr(ctx, x, y, w, h, 10); ctx.fill(); }

function drawOverlays() {
  const g = ctx;
  if (S.demo) {
    const a = 0.75 + 0.25 * Math.sin(S.t * 3);
    g.fillStyle = 'rgba(8,12,30,.72)'; rr(g, 40, TOP + 8, W - 80, 44, 12); g.fill();
    txt('DEMO', W / 2, TOP + 22, 12, `rgba(255,213,74,${a})`, 'center', '800');
    txt('Press any key or tap to play', W / 2, TOP + 39, 13, '#fff', 'center', '600');
  }
  if (S.over) {
    const k = Math.min(1, S.overT * 2);
    g.fillStyle = `rgba(5,8,20,${0.7 * k})`; g.fillRect(0, 0, W, H);
    g.globalAlpha = k;
    txt(S.win ? 'VICTORY!' : 'GAME OVER', W / 2, H / 2 - 40, 38, S.win ? '#ffd54a' : '#ff5d73', 'center', '900');
    txt(S.win ? `All ${MAXW} waves defended with ${S.lives} ♥ left` : `You reached wave ${S.wave}`, W / 2, H / 2 + 4, 15, '#fff', 'center', '600');
    if (!S.demo && S.overT > 0.8) txt('Tap or press any key to play again', W / 2, H / 2 + 40, 13, 'rgba(255,255,255,.7)', 'center', '600');
    g.globalAlpha = 1;
  }
  if (!S.demo && S.wave === 0 && !S.towers.length && !S.build) {
    g.fillStyle = 'rgba(8,12,30,.72)'; rr(g, 30, BOT - 58, W - 60, 46, 12); g.fill();
    txt('Pick a tower below, then tap the grass', W / 2, BOT - 43, 13, '#fff', 'center', '600');
    txt('Tap GO ▶ to send the first wave', W / 2, BOT - 26, 12, 'rgba(255,255,255,.7)', 'center', '600');
  }
}

// ---------- Input ----------
function toGame(ev) { return { x: (ev.clientX - ox) / sc, y: (ev.clientY - oy) / sc }; }
function cellAt(p) {
  if (p.y < TOP || p.y >= BOT || p.x < 0 || p.x >= W) return null;
  return { c: Math.floor(p.x / CS), r: Math.floor((p.y - TOP) / CS) };
}
cv.addEventListener('pointerdown', ev => {
  ev.preventDefault();
  if (S.demo) { newGame(false); return; }
  if (S.over) { if (S.overT > 0.8) newGame(false); return; }
  const p = toGame(ev);
  for (const b of UI) if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { b.act(); return; }
  const cell = cellAt(p); if (!cell) return;
  const t = S.grid.get(cell.c + ',' + cell.r);
  if (t) { S.sel = S.sel === t ? null : t; S.build = null; return; }
  if (S.build) {
    if (!place(S.build, cell.c, cell.r)) {
      if (S.gold < TT[S.build].cost) addText(cx(cell.c), cy(cell.r), 'Need gold', '#ff8b9b', 12);
      else if (PATHCELL.has(cell.c + ',' + cell.r)) addText(cx(cell.c), cy(cell.r), "Can't build on path", '#ff8b9b', 11);
    }
    if (ev.pointerType !== 'mouse') S.hover = cell;
    return;
  }
  S.sel = null;
});
cv.addEventListener('pointermove', ev => { if (!S.demo) S.hover = cellAt(toGame(ev)); });
cv.addEventListener('pointerleave', () => { if (S.hover && S.build) S.hover = null; });
addEventListener('keydown', ev => {
  if (S.demo) { newGame(false); ev.preventDefault(); return; }
  if (S.over) { if (S.overT > 0.8) newGame(false); return; }
  const k = ev.key.toLowerCase();
  const i = ['1', '2', '3'].indexOf(k);
  if (i >= 0) { const t = TKEYS[i]; S.build = S.build === t ? null : t; S.sel = null; }
  else if (k === ' ' || k === 'enter') { ev.preventDefault(); if (!S.waveActive) startWave(); }
  else if (k === 'f') S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 3 : 1;
  else if (k === 'escape') { S.build = null; S.sel = null; }
  else if (k === 'u' && S.sel) upgrade(S.sel);
  else if (k === 's' && S.sel) sell(S.sel);
});
addEventListener('contextmenu', e => e.preventDefault());

// ---------- Boot ----------
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = innerWidth, h = innerHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); cv.style.width = w + 'px'; cv.style.height = h + 'px';
  sc = Math.min(w / W, h / H); ox = (w - W * sc) / 2; oy = (h - H * sc) / 2;
  buildBg();
}
addEventListener('resize', resize);
newGame(true); resize();
let last = performance.now();
function frame(ts) {
  const dt = Math.min(0.05, Math.max(0, (ts - last) / 1000)); last = ts;
  for (let i = 0; i < S.speed; i++) update(dt);
  if (S.selT !== undefined && S.demo) { S.selT -= dt; if (S.selT <= 0) { S.sel = null; S.selT = undefined; } }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
